wsjcpp_version: v0.0.1
cmake_minimum_required: 3.0
cmake_cxx_standard: 17

name: wsjcpp-validators
version: v0.1.4
description: Classes for data validation
issues: https://github.com/wsjcpp/wsjcpp-validators/issues

keywords:
  - c++
  - validator

required-libraries:
  - pthread

repositories:
  - type: main
    url: "https://github.com/wsjcpp/wsjcpp-validators"

authors:
  - name: Evgenii Sopov
    email: mrseakg@gmail.com

distribution:
  - source-file: "src/wsjcpp_validators/wsjcpp_validators.h"
    target-file: "wsjcpp_validators.h"
    type: "source-code"
  - source-file: "src/wsjcpp_validators/wsjcpp_validators.cpp"
    target-file: "wsjcpp_validators.cpp"
    type: "source-code"

dependencies:
  - name: "wsjcpp-core"
    version: "v0.3.0"
    url: "https://github.com/wsjcpp/wsjcpp-core:master"
    origin: "https://github.com/"
    installation-dir: "./src.wsjcpp/wsjcpp_core"
    installation-datetime: "Sun, 16 Aug 2026 04:04:17 GMT"

